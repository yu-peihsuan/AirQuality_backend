[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# strict markers: 打錯 marker 名稱會直接失敗，而不是被靜默忽略
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    known_bug: 用來標記「已知缺陷」的測試。這些測試以 xfail(strict=True) 撰寫，
               修好之後會轉為 XPASS 而使測試套件失敗，強迫移除標記。
    network: 需要真實對外網路（預設不執行）。

filterwarnings =
    ignore::DeprecationWarning
