[pytest]
# ── 為什麼需要這個檔案 ────────────────────────────────────────────────────
# scripts/ 底下是手動維運腳本，不是測試：
#   - manual_fcm_push.py    會對「所有真實裝置」發出推播
#   - check_rag_pipeline.py 會重建知識庫並呼叫付費 LLM
# 兩者的檔名與函式名都已去掉 test_ 前綴，pytest 本來就不會撿走；
# 這裡再排除一次作為第二道防線，避免日後有人改回舊命名時直接踩到。
#
# norecursedirs 會覆寫 pytest 的預設值，因此下方一併保留原本的預設項目。
norecursedirs =
    scripts
    crawler
    rag/chroma_db
    analysis/data
    .*
    build
    dist
    *.egg
    venv
    .venv
    node_modules
    __pycache__

# 維持 pytest 的預設探索規則。明寫出來是為了讓「維運腳本為什麼不能叫
# test_*.py」這件事在設定檔裡有據可循。
python_files = test_*.py
python_classes = Test*
python_functions = test_*
