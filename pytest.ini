[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# strict markers: 打錯 marker 名稱會直接失敗，而不是被靜默忽略
# -m "not network": 需要真實 API（且會產生費用）的整合測試預設不跑。
#                   要執行請明確指定：pytest -m network
addopts =
    --strict-markers
    --strict-config
    -ra
    -m "not network"

markers =
    known_bug: 用來標記「已知缺陷」的測試。這些測試以 xfail(strict=True) 撰寫，
               修好之後會轉為 XPASS 而使測試套件失敗，強迫移除標記。
    network: 需要真實對外網路與 API 金鑰，會產生費用。預設不執行，CI 也不跑。

filterwarnings =
    ignore::DeprecationWarning
